name: Verify release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.x"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Verify root manifest and portability
        shell: bash
        run: |
          python -B scripts/verify_release.py .
          python -B scripts/verify_release.py . --rebuild-root-manifest
          python -B scripts/verify_release.py .
          git diff --exit-code -- ROOT-MANIFEST.sha256

      - name: Verify project-conventions package behavior
        shell: bash
        run: |
          python -B project-conventions/scripts/validate_package.py project-conventions
          python -B project-conventions/scripts/test_inspect_projects_workspace.py
          python -B project-conventions/scripts/test_lifecycle_workflows.py

      - name: Exercise scoped Unix link workflow
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/healthy-skills"
          mkdir -p "$target"
          bash scripts/link-macos.sh --target "$target" --skill project-conventions
          bash scripts/link-macos.sh --target "$target" --skill project-conventions --apply
          bash scripts/link-macos.sh --target "$target" --skill project-conventions
          test -L "$target/project-conventions"
          test "$(readlink "$target/project-conventions")" = "$(cd project-conventions && pwd -P)"

          if bash scripts/link-macos.sh; then
            echo "unscoped invocation unexpectedly succeeded" >&2
            exit 1
          fi

          if bash scripts/link-macos.sh --target "$target" --all-skills --apply; then
            echo "broad Skill apply unexpectedly succeeded" >&2
            exit 1
          fi

          if bash scripts/link-macos.sh --target "$PWD/config" --skill project-conventions --apply; then
            echo "in-repository apply unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e "$PWD/config/project-conventions"

          set +e
          bash scripts/link-macos.sh --target "$RUNNER_TEMP/missing-skills" --skill project-conventions
          missing_status=$?
          set -e
          test "$missing_status" -eq 4

          conflict="$RUNNER_TEMP/conflict-skills"
          mkdir -p "$conflict/project-conventions"
          echo keep > "$conflict/project-conventions/keep.txt"
          set +e
          bash scripts/link-macos.sh --target "$conflict" --skill project-conventions --apply
          conflict_status=$?
          set -e
          test "$conflict_status" -eq 4
          test "$(cat "$conflict/project-conventions/keep.txt")" = keep

      - name: Exercise scoped Windows junction workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'scripts\link-windows.ps1'
          $healthy = Join-Path $env:RUNNER_TEMP 'healthy-skills'
          New-Item -ItemType Directory -Force $healthy | Out-Null

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill project-conventions
          if ($LASTEXITCODE -ne 0) { throw "scan failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill project-conventions -Apply
          if ($LASTEXITCODE -ne 0) { throw "apply failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill project-conventions
          if ($LASTEXITCODE -ne 0) { throw "readback scan failed: $LASTEXITCODE" }

          $created = Get-Item -LiteralPath (Join-Path $healthy 'project-conventions') -Force
          if (-not [bool]($created.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'junction readback failed'
          }
          $actual = [IO.Path]::GetFullPath(@($created.Target)[0])
          $expected = (Resolve-Path (Join-Path $PWD 'project-conventions')).Path
          if ($actual -ne $expected) { throw "junction target differs: $actual" }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -eq 0) { throw 'unscoped invocation unexpectedly succeeded' }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -AllSkills -Apply
          if ($LASTEXITCODE -eq 0) { throw 'broad Skill apply unexpectedly succeeded' }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target (Join-Path $PWD 'config') -Skill project-conventions -Apply
          if ($LASTEXITCODE -eq 0) { throw 'in-repository apply unexpectedly succeeded' }
          if (Test-Path -LiteralPath (Join-Path $PWD 'config\project-conventions')) {
            throw 'in-repository apply wrote a path'
          }

          $missing = Join-Path $env:RUNNER_TEMP 'missing-skills'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $missing -Skill project-conventions
          if ($LASTEXITCODE -ne 4) { throw "missing target status differs: $LASTEXITCODE" }

          $conflict = Join-Path $env:RUNNER_TEMP 'conflict-skills'
          $conflictSkill = Join-Path $conflict 'project-conventions'
          New-Item -ItemType Directory -Force $conflictSkill | Out-Null
          Set-Content -LiteralPath (Join-Path $conflictSkill 'keep.txt') -Value keep
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $conflict -Skill project-conventions -Apply
          if ($LASTEXITCODE -ne 4) { throw "conflict status differs: $LASTEXITCODE" }
          if ((Get-Content -LiteralPath (Join-Path $conflictSkill 'keep.txt') -Raw).Trim() -ne 'keep') {
            throw 'conflict content was modified'
          }
          exit 0

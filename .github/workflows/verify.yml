name: Verify release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks / full history
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.x"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Verify root manifest and portability
        shell: bash
        run: |
          python -B scripts/verify_release.py .
          python -B scripts/verify_release.py . --rebuild-root-manifest
          python -B scripts/verify_release.py .
          git diff --exit-code -- ROOT-MANIFEST.sha256

      - name: Verify project-conventions package behavior
        shell: bash
        run: |
          python -B project-conventions/scripts/validate_package.py project-conventions
          python -B project-conventions/scripts/test_inspect_projects_workspace.py
          python -B project-conventions/scripts/test_lifecycle_workflows.py

      - name: Verify web-bookmark-intelligence package behavior
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check certifi
          python -B web-bookmark-intelligence/scripts/validate_skill.py
          python -B -m unittest discover -s web-bookmark-intelligence/tests -p 'test_*.py'

      - name: Verify media-understanding package behavior
        shell: bash
        run: |
          python -B media-understanding/scripts/validate_skill.py
          python -B -m unittest discover -s media-understanding/tests -p 'test_*.py'

      - name: Verify research-qa-plugin package behavior
        shell: bash
        run: |
          python -B research-qa-plugin/skills/research-qa-orchestrator/scripts/validate_research_qa.py plugin
          python -B -m unittest discover -s research-qa-plugin/skills/research-qa-orchestrator/tests -p 'test_*.py'
          python -B research-qa-plugin/skills/research-qa-orchestrator/bundled/verify_bundled.py

      - name: Verify media-creator package behavior
        shell: bash
        run: |
          python -B media-creator/scripts/validate_skill.py
          python -B -m unittest discover -s media-creator/tests -p 'test_*.py'

      - name: Verify project-handoff package behavior
        shell: bash
        run: |
          python -B project-handoff/scripts/validate_package.py project-handoff
          python -B -m unittest discover -s project-handoff/tests -p 'test_*.py'
          bash -n project-handoff/scripts/run-spark-cli.sh

      - name: Verify document-workspace package behavior
        if: runner.os != 'Windows' || matrix.python != '3.11'
        shell: bash
        run: |
          python -B document-workspace/scripts/validate_package.py document-workspace
          python -B -m unittest discover -s document-workspace/tests -p 'test_*.py'

      - name: Verify document-workspace rejects unsupported Windows Python
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: bash
        run: |
          set +e
          output="$(python -B document-workspace/scripts/validate_package.py document-workspace 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          case "$output" in
            *"Windows requires Python 3.12 or newer for fail-closed junction detection"*) ;;
            *) exit 1 ;;
          esac

      - name: Exercise scoped Unix link workflow
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/healthy-skills"
          mkdir -p "$target"
          bash scripts/link-macos.sh --target "$target" --skill project-conventions
          bash scripts/link-macos.sh --target "$target" --skill project-conventions --apply
          bash scripts/link-macos.sh --target "$target" --skill project-conventions
          test -L "$target/project-conventions"
          test "$(readlink "$target/project-conventions")" = "$(cd project-conventions && pwd -P)"
          bash scripts/link-macos.sh --target "$target" --skill web-bookmark-intelligence
          bash scripts/link-macos.sh --target "$target" --skill media-understanding
          bash scripts/link-macos.sh --target "$target" --skill research-qa-orchestrator
          bash scripts/link-macos.sh --target "$target" --skill media-creator
          bash scripts/link-macos.sh --target "$target" --skill project-handoff

          if bash scripts/link-macos.sh; then
            echo "unscoped invocation unexpectedly succeeded" >&2
            exit 1
          fi

          if bash scripts/link-macos.sh --target "$target" --all-skills --apply; then
            echo "broad Skill apply unexpectedly succeeded" >&2
            exit 1
          fi

          if bash scripts/link-macos.sh --target "$PWD/config" --skill project-conventions --apply; then
            echo "in-repository apply unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e "$PWD/config/project-conventions"

          set +e
          bash scripts/link-macos.sh --target "$RUNNER_TEMP/missing-skills" --skill project-conventions
          missing_status=$?
          set -e
          test "$missing_status" -eq 4

          conflict="$RUNNER_TEMP/conflict-skills"
          mkdir -p "$conflict/project-conventions"
          echo keep > "$conflict/project-conventions/keep.txt"
          set +e
          bash scripts/link-macos.sh --target "$conflict" --skill project-conventions --apply
          conflict_status=$?
          set -e
          test "$conflict_status" -eq 4
          test "$(cat "$conflict/project-conventions/keep.txt")" = keep

      - name: Exercise scoped Windows junction workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'scripts\link-windows.ps1'
          $healthy = Join-Path $env:RUNNER_TEMP 'healthy-skills'
          New-Item -ItemType Directory -Force $healthy | Out-Null

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill project-conventions
          if ($LASTEXITCODE -ne 0) { throw "scan failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill project-conventions -Apply
          if ($LASTEXITCODE -ne 0) { throw "apply failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill project-conventions
          if ($LASTEXITCODE -ne 0) { throw "readback scan failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill web-bookmark-intelligence
          if ($LASTEXITCODE -ne 0) { throw "web-bookmark-intelligence scan failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill media-understanding
          if ($LASTEXITCODE -ne 0) { throw "media-understanding scan failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill research-qa-orchestrator
          if ($LASTEXITCODE -ne 0) { throw "research-qa-orchestrator scan failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill media-creator
          if ($LASTEXITCODE -ne 0) { throw "media-creator scan failed: $LASTEXITCODE" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -Skill project-handoff
          if ($LASTEXITCODE -ne 0) { throw "project-handoff scan failed: $LASTEXITCODE" }

          $created = Get-Item -LiteralPath (Join-Path $healthy 'project-conventions') -Force
          if (-not [bool]($created.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'junction readback failed'
          }
          $actual = [IO.Path]::GetFullPath(@($created.Target)[0])
          $expected = (Resolve-Path (Join-Path $PWD 'project-conventions')).Path
          if ($actual -ne $expected) { throw "junction target differs: $actual" }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -eq 0) { throw 'unscoped invocation unexpectedly succeeded' }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $healthy -AllSkills -Apply
          if ($LASTEXITCODE -eq 0) { throw 'broad Skill apply unexpectedly succeeded' }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target (Join-Path $PWD 'config') -Skill project-conventions -Apply
          if ($LASTEXITCODE -eq 0) { throw 'in-repository apply unexpectedly succeeded' }
          if (Test-Path -LiteralPath (Join-Path $PWD 'config\project-conventions')) {
            throw 'in-repository apply wrote a path'
          }

          $missing = Join-Path $env:RUNNER_TEMP 'missing-skills'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $missing -Skill project-conventions
          if ($LASTEXITCODE -ne 4) { throw "missing target status differs: $LASTEXITCODE" }

          $conflict = Join-Path $env:RUNNER_TEMP 'conflict-skills'
          $conflictSkill = Join-Path $conflict 'project-conventions'
          New-Item -ItemType Directory -Force $conflictSkill | Out-Null
          Set-Content -LiteralPath (Join-Path $conflictSkill 'keep.txt') -Value keep
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Target $conflict -Skill project-conventions -Apply
          if ($LASTEXITCODE -ne 4) { throw "conflict status differs: $LASTEXITCODE" }
          if ((Get-Content -LiteralPath (Join-Path $conflictSkill 'keep.txt') -Raw).Trim() -ne 'keep') {
            throw 'conflict content was modified'
          }
          exit 0

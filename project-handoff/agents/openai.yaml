interface:
  display_name: "Project Handoff Controller"
  short_description: "Create verified visible-task and portable handoffs"
  default_prompt: "Use $project-handoff to create a complete portable handoff or dispatch visible Codex tasks with validated receipts. Preserve explicit routes, omit unselected create_thread model/thinking fields, never substitute subagents for requested visible Codex tasks. For explicit auto use Astra ultra for hardest reasoning, Astra high for orchestration, Sol max for writing/development, Sol medium for desktop operation, and Luna max for simple browser/mechanical tasks. Resolve unversioned families from verified destination capabilities; current baselines are GPT-6 Astra, GPT-6.1 Sol, GPT-6 Luna. Keep exact model IDs and existing task routes pinned; diagnose without silent fallback."

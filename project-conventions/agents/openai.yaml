interface:
  display_name: "Project Conventions"
  short_description: "Route full bootstrap/migration separately from update-only"
  default_prompt: "Use $project-conventions to select the lifecycle first. For a named full chain, clone inside the exact current Project Root, or preserve an explicitly authorized clean local-ahead default branch before switching the checkout to fresh remote main; then validate and read the checked-out Skill directly, continue in the same task to initialize one named target and migrate only the named sources, and defer one scoped Skill link until its final path exists. Use a fresh-session stop only for bootstrap-only discovery. For update-only, refresh and validate only the named checkout, then stop without restructuring, branch preservation, records, scans, or link work."

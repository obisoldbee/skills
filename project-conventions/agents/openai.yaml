interface:
  display_name: "Project Conventions"
  short_description: "Separate initialization from update-only project work"
  default_prompt: "Use $project-conventions to select the lifecycle first. For full initialization, respect the bootstrap/fresh-session boundary and then initialize exactly one Projects Workspace, Project Collection, or Project Root. For update-only, refresh and validate only the named checkout, then stop without restructuring, records, scans, or link work."

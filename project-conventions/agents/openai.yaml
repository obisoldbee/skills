interface:
  display_name: "Project Conventions"
  short_description: "Govern project roots, repositories, and safe concurrency"
  default_prompt: "Use $project-conventions to choose the exact lifecycle and path roles. Initialize or adopt only when that is the selected request; never interrupt an unrelated task merely because a legacy project lacks the local helper. Preserve repository and material boundaries, and use worktree-first collaboration by default: independent branches/worktrees for code, distinct report files, and one integrator. Do not require persistent claims. Migrate an existing copied policy only for the named authorized project."
